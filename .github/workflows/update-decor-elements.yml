name: Update decor element galleries

on:
  push:
    paths:
      - '.github/update_decor_element_modal.py'
      - '.github/workflows/update-decor-elements.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update homepage decor element galleries
        run: python3 .github/update_decor_element_modal.py
      - name: Commit homepage update
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add index.html
          git commit -m "Add filtered decor element light galleries" || exit 0
          git push
