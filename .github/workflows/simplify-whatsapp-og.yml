name: Simplify WhatsApp OG

on:
  push:
    branches: [ main ]
    paths:
      - '.github/simplify_whatsapp_og.py'
      - '.github/workflows/simplify-whatsapp-og.yml'

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Simplify metadata
        run: python .github/simplify_whatsapp_og.py
      - name: Commit metadata cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Simplify WhatsApp Open Graph metadata"
            git push
          fi
