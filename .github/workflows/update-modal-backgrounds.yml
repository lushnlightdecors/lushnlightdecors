name: Update modal backgrounds

on:
  push:
    branches: [ main ]
    paths:
      - '.github/update_modal_backgrounds.py'
      - '.github/workflows/update-modal-backgrounds.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update modal CSS
        run: python .github/update_modal_backgrounds.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use uploaded modal background images"
            git push
          fi
