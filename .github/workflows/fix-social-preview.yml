name: Fix social preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/fix_social_preview.py'
      - '.github/workflows/fix-social-preview.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update preview metadata
        run: python .github/fix_social_preview.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social-preview.png
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix WhatsApp social preview metadata"
            git push
          fi
