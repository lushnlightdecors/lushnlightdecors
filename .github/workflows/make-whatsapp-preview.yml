name: Optimize WhatsApp preview

on:
  push:
    branches: [ main ]
    paths:
      - '.github/make_whatsapp_preview.py'
      - '.github/workflows/make-whatsapp-preview.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: pip install pillow
      - name: Build WhatsApp preview
        run: python .github/make_whatsapp_preview.py
      - name: Commit optimized preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html social-preview.jpg
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Optimize WhatsApp link preview image"
            git push
          fi
