name: Swap flower and accessories modal backgrounds

on:
  push:
    branches: [ main ]
    paths:
      - '.github/swap_flower_accessories.py'
      - '.github/workflows/swap-flower-accessories.yml'

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Swap modal mappings
        run: python .github/swap_flower_accessories.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Correct floral and accessories background mapping"
            git push
          fi
