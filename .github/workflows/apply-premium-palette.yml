name: Apply premium colour palette

on:
  push:
    branches: [ main ]
    paths:
      - '.github/apply_premium_palette.py'
      - '.github/workflows/apply-premium-palette.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply palette
        run: python .github/apply_premium_palette.py
      - name: Commit palette update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*/index.html'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Apply premium website colour palette"
            git push
          fi
