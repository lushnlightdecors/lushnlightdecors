name: Apply exact decor modal backgrounds
on:
  push:
    paths:
      - '.github/update_exact_modal_backgrounds.py'
      - '.github/workflows/update-exact-modal-backgrounds.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update modal backgrounds
        run: python3 .github/update_exact_modal_backgrounds.py
      - name: Commit website update
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add index.html
          git commit -m "Use exact pastel images for decor modal backgrounds" || exit 0
          git push
