name: Update luxury modal panels

on:
  push:
    paths:
      - '.github/update_luxury_modal_panels.py'
      - '.github/workflows/update-luxury-modal-panels.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update modal panels
        run: python3 .github/update_luxury_modal_panels.py
      - name: Commit website update
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add index.html
          git commit -m "Use subtle luxury themes inside decor modals" || exit 0
          git push
