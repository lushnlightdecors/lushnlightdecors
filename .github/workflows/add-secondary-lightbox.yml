name: Add secondary page lightbox

on:
  push:
    paths:
      - '.github/workflows/add-secondary-lightbox.yml'

permissions:
  contents: write

jobs:
  add-lightbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update secondary pages
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/add_lightbox.py
          python3 /tmp/add_lightbox.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add about/index.html wedding-decor/index.html birthday-decor/index.html baby-shower-decor/index.html aqiqah-decor/index.html mehndi-traditional-decor/index.html
          git commit -m "Add gallery lightbox to secondary pages" || exit 0
          git push
