name: Add secondary page lightboxes

on:
  push:
    paths:
      - '.github/workflows/add-secondary-lightbox.yml'

permissions:
  contents: write

jobs:
  add-lightboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add gallery lightbox to secondary pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [
              Path('about/index.html'),
              Path('wedding-decor/index.html'),
              Path('birthday-decor/index.html'),
              Path('baby-shower-decor/index.html'),
              Path('aqiqah-decor/index.html'),
              Path('mehndi-traditional-decor/index.html'),
          ]

          css = '''
/* Secondary page gallery lightbox */
.page-lightbox{position:fixed;inset:0;z-index:9999;background:rgba(12,24,18,.94);display:none;align-items:center;justify-content:center;padding:24px}
.page-lightbox.open{display:flex}
.page-lightbox img{max-width:min(1100px,90vw);max-height:86vh;object-fit:contain;border-radius:10px;box-shadow:0 18px 60px rgba(0,0,0,.32)}
.page-lightbox button{position:absolute;border:0;background:rgba(255,255,255,.94);color:#123f2a;width:48px;height:48px;border-radius:50%;font-size:1.7rem;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 5px 18px rgba(0,0,0,.18)}
.page-lightbox button:hover{background:#fff;transform:scale(1.05)}
.page-lb-close{right:22px;top:22px}.page-lb-prev{left:22px}.page-lb-next{right:22px}.page-lightbox-thumb{cursor:zoom-in}
@media(max-width:760px){.page-lightbox{padding:12px}.page-lightbox img{max-width:94vw;max-height:82vh}.page-lightbox button{width:42px;height:42px}.page-lb-prev{left:8px}.page-lb-next{right:8px}.page-lb-close{right:8px;top:8px}}
'''

          markup = '''
<div class="page-lightbox" id="page-lightbox" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Image gallery viewer"><button class="page-lb-close" type="button" aria-label="Close">×</button><button class="page-lb-prev" type="button" aria-label="Previous photo">‹</button><img id="page-lightbox-image" alt="LushnLight Decors gallery photo"><button class="page-lb-next" type="button" aria-label="Next photo">›</button></div>
'''

          script = '''
<script id="secondary-lightbox-script">(function(){const box=document.getElementById("page-lightbox"),image=document.getElementById("page-lightbox-image");if(!box||!image)return;let thumbs=[...document.querySelectorAll("#gallery .gallery img")];if(!thumbs.length)thumbs=[...document.querySelectorAll(".evolve-photo")];if(!thumbs.length)return;let current=0,lastFocus=null;const closeBtn=box.querySelector(".page-lb-close");function show(i){current=(i+thumbs.length)%thumbs.length;const source=thumbs[current];image.src=source.currentSrc||source.src;image.alt=source.alt||"LushnLight Decors gallery photo";lastFocus=source;box.classList.add("open");box.setAttribute("aria-hidden","false");document.body.style.overflow="hidden";closeBtn.focus()}function close(){box.classList.remove("open");box.setAttribute("aria-hidden","true");document.body.style.overflow="";if(lastFocus)lastFocus.focus({preventScroll:true})}thumbs.forEach((thumb,i)=>{thumb.classList.add("page-lightbox-thumb");thumb.setAttribute("role","button");thumb.setAttribute("tabindex","0");thumb.addEventListener("click",()=>show(i));thumb.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(i)}})});closeBtn.onclick=close;box.querySelector(".page-lb-prev").onclick=()=>show(current-1);box.querySelector(".page-lb-next").onclick=()=>show(current+1);box.addEventListener("click",e=>{if(e.target===box)close()});document.addEventListener("keydown",e=>{if(!box.classList.contains("open"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(current-1);else if(e.key==="ArrowRight")show(current+1)})})();</script>
'''

          for path in pages:
              text = path.read_text(encoding='utf-8')
              if 'secondary-lightbox-script' in text:
                  continue
              style_end = text.rfind('</style>')
              if style_end == -1:
                  raise RuntimeError(f'No </style> in {path}')
              text = text[:style_end] + css + text[style_end:]
              body_end = text.rfind('</body>')
              if body_end == -1:
                  raise RuntimeError(f'No </body> in {path}')
              text = text[:body_end] + markup + script + text[body_end:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit secondary lightboxes
        shell: bash
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add about/index.html wedding-decor/index.html birthday-decor/index.html baby-shower-decor/index.html aqiqah-decor/index.html mehndi-traditional-decor/index.html
          git commit -m "Add gallery lightbox navigation to secondary pages" || exit 0
          git push
