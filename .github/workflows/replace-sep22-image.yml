name: Replace old image everywhere

on:
  push:
    branches: [ main ]
    paths:
      - '.github/replace_sep22_image.py'
      - '.github/workflows/replace-sep22-image.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Replace image references
        run: python .github/replace_sep22_image.py
      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github'
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Replace Sep 22 image with Sep 24 image"
            git push
          fi
