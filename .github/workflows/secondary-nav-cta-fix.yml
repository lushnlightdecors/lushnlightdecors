name: Secondary nav and CTA fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/secondary_nav_cta_fix.py'
      - '.github/workflows/secondary-nav-cta-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply secondary page navigation and CTA styling
        run: python .github/secondary_nav_cta_fix.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about/index.html wedding-decor/index.html birthday-decor/index.html baby-shower-decor/index.html aqiqah-decor/index.html mehndi-traditional-decor/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Match secondary nav hover and highlight quote CTA"
            git push
          fi
