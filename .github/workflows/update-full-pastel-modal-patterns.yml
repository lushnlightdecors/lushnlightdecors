name: Update full pastel modal patterns

on:
  push:
    paths:
      - '.github/update_full_pastel_modal_patterns.py'
      - '.github/workflows/update-full-pastel-modal-patterns.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update full pastel modal patterns
        run: python3 .github/update_full_pastel_modal_patterns.py
      - name: Commit website update
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add index.html
          git commit -m "Expand pastel artwork across decor modal panels" || exit 0
          git push
