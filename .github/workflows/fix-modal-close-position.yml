name: Fix modal close position

on:
  push:
    branches: [ main ]
    paths:
      - '.github/fix_modal_close_position.py'
      - '.github/workflows/fix-modal-close-position.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply close position fix
        run: python .github/fix_modal_close_position.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep decor modal close button inside panel"
            git push
          fi
