name: Apply site updates

"on":
  push:
    paths:
      - '.github/update_site.py'
      - '.github/workflows/apply-site-updates.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested website changes
        run: python3 .github/update_site.py
      - name: Commit website changes
        run: |
          git config user.name "lushnlightdecors"
          git config user.email "lushnlightdecors@gmail.com"
          git add index.html about/index.html wedding-decor/index.html birthday-decor/index.html baby-shower-decor/index.html aqiqah-decor/index.html mehndi-traditional-decor/index.html
          git commit -m "Match gallery hover and footer design across pages" || exit 0
          git push
