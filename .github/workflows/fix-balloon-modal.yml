name: Fix balloon modal background

on:
  push:
    branches: [ main ]
    paths:
      - '.github/fix_balloon_modal.py'
      - '.github/workflows/fix-balloon-modal.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update balloon modal CSS
        run: python .github/fix_balloon_modal.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix broken balloon modal background"
            git push
          fi
