name: Update Sep 23 gallery

on:
  push:
    branches: [ main ]
    paths:
      - '.github/update_gallery_sep23.py'
      - '.github/workflows/update-gallery-sep23.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update gallery and pages
        run: python .github/update_gallery_sep23.py
      - name: Commit site updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json decor-elements.json index.html wedding-decor/index.html birthday-decor/index.html baby-shower-decor/index.html mehndi-traditional-decor/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Update gallery images and shower naming"
            git push
          fi
